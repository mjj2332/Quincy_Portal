<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy Portal</title>
<link rel="icon" href="assets/logos/quincy-qp-black.png">

<!-- Resources referenced from JS (lifted for the standalone bundler) -->
<meta name="ext-resource-dependency" content="assets/logos/quincy-wordmark-white.png" data-resource-id="wmWhite" />
<meta name="ext-resource-dependency" content="assets/logos/quincy-wordmark-black.png" data-resource-id="wmBlack" />

<!-- NOTE: the property cover photos are hosted on Quincy's Pixieset delivery CDN,
     which sends no CORS headers, so they cannot be embedded into the file. They
     stay as live links and load when the viewer is online (same as the app). -->

<!-- React + Babel (pinned) -->

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Quincy Productions design system -->
<link rel="stylesheet" href="_ds/quincy-productions-design-system-b05a1c92-e535-473c-9869-277317e90689/styles.css">

<!-- App styles -->
<link rel="stylesheet" href="app.css">
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#FAF8F2">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

      <rect x="449" y="232" width="90" height="60"/>
      <rect x="555" y="232" width="90" height="60"/>
