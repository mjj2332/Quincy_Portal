name: Quincy Portal

on:
  push:
    paths:
      - "portal/**"
  pull_request:
    paths:
      - "portal/**"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npx tsc -p packages/shared/tsconfig.json
      - run: npx tsc -p packages/db/tsconfig.json
      - run: npx tsc -p apps/web/tsconfig.json
      - run: npx tsc -p workers/app/tsconfig.json
      - run: npx tsc -p workers/background/tsconfig.json
      - run: npx tsc -p workers/webhook-ingress/tsconfig.json

  test:
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      # workers/app's tests serve the SPA through the ASSETS binding, which
      # reads apps/web/dist — build it first since jobs don't share a filesystem.
      - run: npm run build -w @quincy/web
      - run: npx vitest run --config packages/shared/vitest.config.ts
      - run: npx vitest run --config packages/db/vitest.config.ts
      - run: npx vitest run --config workers/app/vitest.config.ts
      - run: npx vitest run --config workers/app/vitest.dev.config.ts
      - run: npx vitest run --config workers/webhook-ingress/vitest.config.ts
      - run: npx vitest run --config workers/background/vitest.config.ts
      - run: npx vitest run --config apps/web/vitest.config.ts
      # The DOM suite (85 files / 980 tests) is the most expensive of the eight on the CI
      # runner at ~135s, but only narrowly ahead of workers/app at ~120s — splitting it into
      # its own job or sharding it would not shorten this job without splitting that one too,
      # so it is appended here (#158). Revisit if the job keeps growing. Measure on the runner,
      # not locally: a dev machine's parallelism runs this suite in ~7s and hides the cost.
      - run: npx vitest run --config apps/web/vitest.dom.config.ts

  build-web:
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run build -w @quincy/web

  deploy:
    needs: [typecheck, test, build-web]
    # Production deploy: main only (a merge, or "Run workflow" on main), after every check passes.
    # One deploy at a time; a running deploy is never cancelled half-way through its Workers.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5649541c0660b8c9b45d114a868ebc13
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      # The `secrets` context is not allowed in a job-level `if:`, so the token check is a step.
      - name: Require the Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set. See docs/Guides/CI-Deploy.md."
            exit 1
          fi
      # CI never applies migrations. New code that needs a migration production lacks would break
      # the live site, so the deploy stops until a human applies it (docs/Guides/CI-Deploy.md).
      - name: Stop if production has unapplied D1 migrations
        run: |
          out=$(npx wrangler d1 migrations list DB --remote --config workers/app/wrangler.jsonc 2>&1) || true
          echo "$out"
          if ! echo "$out" | grep -q "No migrations to apply"; then
            echo "::error::Production D1 has unapplied migrations (or the check failed). Apply them by hand, then re-run this job."
            exit 1
          fi
      # The app Worker serves apps/web/dist, and jobs don't share a filesystem.
      - run: npm run build -w @quincy/web
      # Service bindings resolve when a Worker is deployed, so deploy their target first.
      - run: npx wrangler deploy --config workers/background/wrangler.jsonc
      - run: npx wrangler deploy --config workers/webhook-ingress/wrangler.jsonc
      - run: npx wrangler deploy --config workers/app/wrangler.jsonc
